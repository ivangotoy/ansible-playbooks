---
# Variables: group_vars/kubernetes.yml

- name: Download pending upgrades on every node
  hosts: kubernetes
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Remove package staging and records of the previous design
      ansible.builtin.command:
        argv:
          - find
          - /var/lib/ansible-maintenance
          - -maxdepth
          - "1"
          - (
          - -name
          - packages-*
          - -o
          - -name
          - pending.json
          - -o
          - -name
          - completed.json
          - )
          - -print
          - -exec
          - rm
          - -rf
          - "{}"
          - +
      register: node_update_cleanup
      changed_when: node_update_cleanup.stdout != ""

    - name: Sync the package databases
      community.general.pacman:
        update_cache: true

    - name: Download pending repository packages into the pacman cache
      community.general.pacman:
        upgrade: true
        upgrade_extra_args: --downloadonly
      register: node_update_download
      changed_when: "'Retrieving packages' in node_update_download.stdout | default('')"

    - name: List pending AUR upgrades
      ansible.builtin.command:
        argv: [paru, -Qua, --color, never]
      become: false
      register: node_update_aur
      changed_when: false
      failed_when: node_update_aur.rc not in [0, 1]

    - name: Select the nodes that have upgrades
      ansible.builtin.group_by:
        key: node_update_pending
      when: node_update_repo_pending | length > 0 or node_update_aur_pending | length > 0
      changed_when: false

- name: Upgrade the pending nodes one at a time, control plane first
  hosts: kube:kubernetes:&node_update_pending
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Record the start time
      ansible.builtin.set_fact:
        node_update_started: "{{ now().timestamp() | int }}"

    - name: Drain, upgrade and return the node
      when: node_update_repo_pending | length > 0
      block:
        - name: Wait for the API server to be ready
          ansible.builtin.command:
            argv: "{{ node_update_kubectl + ['get', '--raw=/readyz'] }}"
          delegate_to: "{{ node_update_control_plane }}"
          register: node_update_readyz
          changed_when: false
          until: node_update_readyz.rc == 0
          retries: 30
          delay: 5

        - name: Wait for every node to be Ready
          ansible.builtin.command:
            argv: "{{ node_update_kubectl + ['wait', 'nodes', '--all', '--for=condition=Ready',
              '--timeout=' ~ node_update_wait_timeout ~ 's'] }}"
          delegate_to: "{{ node_update_control_plane }}"
          changed_when: false

        - name: Wait for every deployment to be available
          ansible.builtin.command:
            argv: "{{ node_update_kubectl + ['wait', 'deployments', '--all', '--all-namespaces',
              '--for=condition=Available', '--timeout=' ~ node_update_wait_timeout ~ 's'] }}"
          delegate_to: "{{ node_update_control_plane }}"
          changed_when: false

        - name: Read the node state before the drain
          ansible.builtin.command:
            argv: "{{ node_update_kubectl + ['get', 'node', node_update_node_name, '-o', 'json'] }}"
          delegate_to: "{{ node_update_control_plane }}"
          register: node_update_node_read
          changed_when: false

        - name: Check the Kubernetes version step
          when: node_update_kubernetes_pending
          block:
            - name: Read the Kubernetes version offered by the repository
              ansible.builtin.command:
                argv: [pacman, -Sp, --print-format, "%v", kubeadm]
              register: node_update_kube_candidate
              changed_when: false

            - name: Read the API server version
              ansible.builtin.command:
                argv: "{{ node_update_kubectl + ['version', '-o', 'json'] }}"
              delegate_to: "{{ node_update_control_plane }}"
              register: node_update_api
              changed_when: false

            - name: Require a supported Kubernetes version step
              ansible.builtin.assert:
                that: node_update_kube_step_supported
                quiet: true
                fail_msg: >-
                  Kubernetes {{ node_update_kube_target }} is not a supported step on {{ node_update_node_name }}
                  while the API server is at {{ node_update_api_version }}.

        - name: Drain the node
          ansible.builtin.command:
            argv: "{{ node_update_kubectl + ['drain', node_update_node_name, '--ignore-daemonsets',
              '--delete-emptydir-data', '--timeout=' ~ node_update_drain_timeout ~ 's'] }}"
          delegate_to: "{{ node_update_control_plane }}"
          register: node_update_drain
          changed_when: "'evicted' in node_update_drain.stdout or not node_update_was_cordoned"

        - name: Upgrade Kubernetes with kubeadm before the kubelet
          when: node_update_kubernetes_pending
          block:
            - name: Back up /etc/kubernetes and etcd before the control plane upgrade
              when: node_update_kubeadm_apply
              block:
                - name: Create the backup directory
                  ansible.builtin.file:
                    path: "{{ node_update_backup_dir }}"
                    state: directory
                    mode: "0700"

                - name: Archive /etc/kubernetes
                  ansible.builtin.command:
                    argv: [tar, -C, /, -czf, "{{ node_update_backup_dir }}/etc-kubernetes.tar.gz", etc/kubernetes]
                    creates: "{{ node_update_backup_dir }}/etc-kubernetes.tar.gz"

                - name: Find the etcd container
                  ansible.builtin.command:
                    argv: "{{ node_update_crictl + ['ps', '--name', 'etcd', '--quiet'] }}"
                  register: node_update_etcd
                  changed_when: false

                - name: Save an etcd snapshot
                  ansible.builtin.command:
                    argv: "{{ node_update_crictl + ['exec', node_update_etcd.stdout_lines | first, 'etcdctl',
                      '--endpoints=https://127.0.0.1:2379', '--cacert=/etc/kubernetes/pki/etcd/ca.crt',
                      '--cert=/etc/kubernetes/pki/etcd/server.crt', '--key=/etc/kubernetes/pki/etcd/server.key',
                      'snapshot', 'save', node_update_etcd_data ~ '/pre-upgrade-snapshot.db'] }}"
                  changed_when: true

                - name: Move the etcd snapshot into the backup directory
                  ansible.builtin.command:
                    argv:
                      - mv
                      - "{{ node_update_etcd_data }}/pre-upgrade-snapshot.db"
                      - "{{ node_update_backup_dir }}/etcd-snapshot.db"
                    removes: "{{ node_update_etcd_data }}/pre-upgrade-snapshot.db"

            - name: Install the new kubeadm
              community.general.pacman:
                name: kubeadm
                state: latest

            - name: Upgrade the control plane
              ansible.builtin.command:
                argv: [kubeadm, upgrade, apply, "v{{ node_update_kube_target }}", --yes]
              when: node_update_kubeadm_apply
              changed_when: true

            - name: Upgrade the kubelet configuration of the worker
              ansible.builtin.command:
                argv: [kubeadm, upgrade, node]
              when: node_update_kubeadm_node
              changed_when: true

        - name: Install the downloaded upgrade
          community.general.pacman:
            upgrade: true

        - name: Read the running kernel release
          ansible.builtin.command:
            argv: [uname, -r]
          register: node_update_kernel
          changed_when: false

        - name: Check that the running kernel is still the installed one
          ansible.builtin.stat:
            path: /usr/lib/modules/{{ node_update_kernel.stdout }}/vmlinuz
          register: node_update_kernel_stat

        - name: Check for the reboot marker of the pacman hooks
          ansible.builtin.stat:
            path: "{{ node_update_reboot_marker }}"
          register: node_update_marker_stat

        - name: Reboot the node
          ansible.builtin.reboot:
            reboot_timeout: "{{ node_update_reboot_timeout }}"
          when: node_update_reboot_required
          register: node_update_reboot

        - name: Restart containerd after its packages changed
          ansible.builtin.systemd_service:
            name: containerd
            state: restarted
          when:
            - not node_update_reboot_required
            - node_update_repo_pending | intersect(['containerd', 'runc']) | length > 0

        - name: Restart the kubelet after the Kubernetes packages changed
          ansible.builtin.systemd_service:
            name: kubelet
            state: restarted
            daemon_reload: true
          when:
            - not node_update_reboot_required
            - node_update_kubernetes_pending

        - name: Read the installed kubelet version
          ansible.builtin.command:
            argv: [kubelet, --version]
          register: node_update_kubelet
          changed_when: false

        - name: Read the boot ID
          ansible.builtin.slurp:
            src: /proc/sys/kernel/random/boot_id
          register: node_update_boot

        - name: Wait for the API server port
          ansible.builtin.wait_for:
            port: 6443
            timeout: "{{ node_update_wait_timeout }}"
          delegate_to: "{{ node_update_control_plane }}"

        - name: Wait for the API server to be ready again
          ansible.builtin.command:
            argv: "{{ node_update_kubectl + ['get', '--raw=/readyz'] }}"
          delegate_to: "{{ node_update_control_plane }}"
          register: node_update_readyz
          changed_when: false
          until: node_update_readyz.rc == 0
          retries: 30
          delay: 5

        - name: Wait for the node to report this boot, the installed kubelet and Ready
          ansible.builtin.command:
            argv: "{{ node_update_kubectl + ['wait', 'node/' ~ node_update_node_name, '--for=' ~ item,
              '--timeout=' ~ node_update_wait_timeout ~ 's'] }}"
          delegate_to: "{{ node_update_control_plane }}"
          loop:
            - jsonpath={.status.nodeInfo.bootID}={{ node_update_boot.content | b64decode | trim }}
            - jsonpath={.status.nodeInfo.kubeletVersion}={{ node_update_kubelet.stdout.split() | last }}
            - condition=Ready
          changed_when: false

        - name: Uncordon the node
          ansible.builtin.command:
            argv: "{{ node_update_kubectl + ['uncordon', node_update_node_name] }}"
          delegate_to: "{{ node_update_control_plane }}"
          when: not node_update_was_cordoned
          changed_when: true

    - name: Build and install pending AUR upgrades
      ansible.builtin.command:
        argv: [paru, -Sua, --noconfirm, --skipreview]
      become: false
      when: node_update_aur_pending | length > 0
      changed_when: true
      timeout: "{{ node_update_aur_timeout }}"

    - name: Record the result
      ansible.builtin.set_fact:
        node_update_rebooted: "{{ node_update_reboot.rebooted | default(false) }}"
        node_update_elapsed: "{{ now().timestamp() | int - node_update_started | int }}"

- name: Summarize the update
  hosts: kubernetes
  become: true
  gather_facts: false
  tasks:
    - name: Read the kubelet version the node reports
      ansible.builtin.command:
        argv: "{{ node_update_kubectl + ['get', 'node', node_update_node_name,
          '-o', 'jsonpath={.status.nodeInfo.kubeletVersion}'] }}"
      delegate_to: "{{ node_update_control_plane }}"
      register: node_update_reported
      changed_when: false

    - name: Show the result per node
      ansible.builtin.debug:
        msg: "{{ node_update_summary }}"
