---
- name: Update Jenkins plugins
  hosts: alder
  become: true
  vars:
    # The play runs on the Jenkins host itself.
    jenkins_url: "http://127.0.0.1:8090"
    jenkins_username: "ivangotoy"
    jenkins_api_token: "{{ vault_jenkins_api_token }}"
  tasks:
    - name: Fetch Jenkins plugin list with updates
      ansible.builtin.uri:
        url: "{{ jenkins_url }}/pluginManager/api/json?depth=1"
        user: "{{ jenkins_username }}"
        password: "{{ jenkins_api_token }}"
        force_basic_auth: true
      register: plugins_response

    - name: Update outdated plugins
      community.general.jenkins_plugin:
        url: "{{ jenkins_url }}"
        url_username: "{{ jenkins_username }}"
        url_password: "{{ jenkins_api_token }}"
        name: "{{ item }}"
        state: latest
      loop: "{{ plugins_response.json.plugins | selectattr('hasUpdate') | map(attribute='shortName') | list }}"
      notify: Restart Jenkins

  handlers:
    # Updated plugins are loaded only by a restart.
    - name: Restart Jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        state: restarted
