---
# Kubernetes cluster performance tuning
# Applies: CPU governor, THP, network buffers, containerd optimizations
# Containerd changes require Python 3.11+ and native config validation.

- name: Phase 1 — sysctl + CPU governor + THP (all nodes, zero downtime)
  hosts: kubernetes
  become: true
  gather_facts: false

  tasks:
    - name: Set CPU governor to performance
      ansible.builtin.command:
        argv:
          - cpupower
          - frequency-set
          - -g
          - performance
      changed_when: true

    - name: Persist CPU governor via cpupower config
      ansible.builtin.lineinfile:
        path: /etc/default/cpupower
        regexp: "^governor="
        line: "governor='performance'"
        create: true
        mode: "0644"

    - name: Enable cpupower service
      ansible.builtin.systemd_service:
        name: cpupower
        enabled: true
        state: started

    - name: Set THP to never (runtime)
      ansible.builtin.shell: |
        echo never > /sys/kernel/mm/transparent_hugepage/enabled
        echo never > /sys/kernel/mm/transparent_hugepage/defrag
      changed_when: true

    - name: Persist THP=never via systemd tmpfiles
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/thp-disable.conf
        content: |
          w /sys/kernel/mm/transparent_hugepage/enabled - - - - never
          w /sys/kernel/mm/transparent_hugepage/defrag   - - - - never
        mode: "0644"

    - name: Apply network buffer and perf sysctl
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-k8s-perf.conf
        reload: true
      loop:
        - key: net.core.rmem_max
          value: "134217728"
        - key: net.core.wmem_max
          value: "134217728"
        - key: net.core.rmem_default
          value: "67108864"
        - key: net.core.wmem_default
          value: "67108864"
        - key: net.ipv4.tcp_rmem
          value: "4096 87380 134217728"
        - key: net.ipv4.tcp_wmem
          value: "4096 65536 134217728"
        - key: net.core.netdev_max_backlog
          value: "16384"
        - key: net.ipv4.tcp_slow_start_after_idle
          value: "0"

- name: Phase 2 — containerd tuning (serial restart)
  hosts: kubernetes
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    ansible_remote_tmp: /var/lib/ansible-maintenance/tmp

  tasks:
    - name: Patch containerd config — SystemdCgroup + max_concurrent_downloads
      ansible.builtin.script:
        cmd: files/tune_containerd.py /etc/containerd/config.toml
        executable: python3 -B
      register: containerd_patch
      changed_when: "(containerd_patch.stdout.splitlines() | last | default('')) == 'changed'"
      notify:
        - Restart containerd
        - Wait for containerd to be ready
        - Verify kubelet still healthy

    - name: Run containerd restart and health checks immediately
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted

    - name: Wait for containerd to be ready
      ansible.builtin.command:
        argv:
          - crictl
          - info
      retries: 10
      delay: 3
      register: result
      until: result.rc == 0
      changed_when: false

    - name: Verify kubelet still healthy
      ansible.builtin.systemd_service:
        name: kubelet
      register: kubelet_status
      failed_when: kubelet_status.status.ActiveState != "active"
