---
- name: Detect OS families and group hosts by OS
  hosts: webservers
  gather_facts: true
  become: false
  tasks:
    - name: Add Debian hosts to debian_hosts group
      ansible.builtin.group_by:
        key: "debian_hosts"
      when: ansible_facts['os_family'] == "Debian"
    - name: Add Arch Linux hosts to archlinux_hosts group
      ansible.builtin.group_by:
        key: "archlinux_hosts"
      when: ansible_facts['os_family'] == "Archlinux"

# async is the hard limit of a job: when it expires the package manager is
# killed mid-transaction, so it must exceed the slowest upgrade by far.
- name: Update and upgrade packages on Debian-based systems
  hosts: debian_hosts
  become: true
  serial: 2
  tasks:
    - name: Update package cache on Debian
      ansible.builtin.apt:
        update_cache: true
      async: 600
      poll: 10

    - name: Upgrade packages on Debian after successful cache refresh
      ansible.builtin.apt:
        upgrade: dist
      async: 3600
      poll: 10

- name: Update and upgrade packages on Arch Linux-based systems
  hosts: archlinux_hosts
  become: true
  serial: 2
  tasks:
    - name: Update and upgrade packages on Arch Linux
      community.general.pacman:
        update_cache: true
        upgrade: true
      async: 3600
      poll: 10
