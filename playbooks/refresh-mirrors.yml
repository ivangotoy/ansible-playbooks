---
- name: Refresh CachyOS mirrors on Kubernetes nodes
  hosts: kubernetes
  become: true
  gather_facts: false

  tasks:
    - name: Refresh mirrors with cachyos-rate-mirrors
      ansible.builtin.command:
        argv:
          - cachyos-rate-mirrors
      register: mirror_result
      changed_when: true

    - name: Show mirror refresh output
      ansible.builtin.debug:
        msg: "{{ mirror_result.stdout_lines }}"
      when: mirror_result.stdout != ""

    # cachyos-rate-mirrors always inserts this mirror above the rated Arch
    # list; from these nodes it serves about 0.1 MB/s and stalls core, extra
    # and multilib downloads.
    - name: Remove the forced slow Arch mirror from the rated list
      ansible.builtin.lineinfile:
        path: /etc/pacman.d/mirrorlist
        regexp: '^Server = https://mirror\.zyner\.org/'
        state: absent
