---
- name: Refresh CachyOS mirrors on Kubernetes nodes
  hosts: kubernetes
  become: true
  gather_facts: false

  tasks:
    - name: Refresh mirrors with cachyos-rate-mirrors
      ansible.builtin.command:
        argv:
          - cachyos-rate-mirrors
      register: mirror_result
      changed_when: true

    - name: Show mirror refresh output
      ansible.builtin.debug:
        msg: "{{ mirror_result.stdout_lines }}"
      when: mirror_result.stdout != ""

    # pacman uses only the first Server of a repository, and
    # cachyos-rate-mirrors forces fixed entries above its rated results.
    - name: Order the head of every mirrorlist by measured download speed
      ansible.builtin.script:
        cmd: files/rank_mirrors.py
        executable: python3
      register: mirror_rank
      changed_when: "'REORDERED' in mirror_rank.stdout"

    - name: Show measured mirror speeds
      ansible.builtin.debug:
        msg: "{{ mirror_rank.stdout_lines }}"
